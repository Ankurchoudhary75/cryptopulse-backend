server:
  port: 0

spring:
  application:
    name: cryptopulse-backend-test

  datasource:
    url: jdbc:h2:mem:cryptopulsetestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

cryptopulse:
  ingestion:
    cooldown-minutes: 15
    surge-threshold-percent: 5.0
    crash-threshold-percent: -5.0

management:
  endpoints:
    web:
      exposure:
        include: health
